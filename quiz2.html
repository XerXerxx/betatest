<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<div class="annette-quiz-opt2">
  <style>
    /* Styles partagés de base */
    .annette-quiz-opt2 { --ink: #0F0F0E; --muted: #4A4A4A; --card-bg: #A9E1FF; --element-bg: #FEFBF9; font-family: 'Inter', sans-serif; color: var(--ink); display: flex; justify-content: center; width: 100%; margin: 32px 0 !important; -webkit-font-smoothing: antialiased; }
    .annette-quiz-opt2 * { box-sizing: border-box; }
    .annette-quiz-opt2 .card { background: var(--card-bg) !important; border-radius: 24px !important; padding: 2rem !important; max-width: 480px !important; width: 100% !important; min-height: 340px !important; box-shadow: 0 12px 36px rgba(15, 15, 14, 0.08) !important; opacity: 0; transform: translateY(30px) scale(0.98); transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .annette-quiz-opt2 .card.is-visible { opacity: 1; transform: translateY(0) scale(1); }
    .annette-quiz-opt2 .slide-container { animation: slideInBottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important; }
    .annette-quiz-opt2 .slide-container.slide-out { animation: slideOutTop 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important; }
    @keyframes slideInBottom { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideOutTop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }

    /* Styles spécifiques Bulles : Structurées et séparées du texte */
    .annette-quiz-opt2 .hook-container { display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 10px 0;}
    .annette-quiz-opt2 .bubble-wrap { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 24px !important; }
    .annette-quiz-opt2 .bubble { background: var(--element-bg) !important; color: var(--ink) !important; padding: 8px 16px !important; border-radius: 20px !important; font-size: 14px !important; font-weight: 600 !important; box-shadow: 0 4px 12px rgba(15,15,14,0.06) !important; border: 1.5px solid var(--ink) !important; animation: floatBubble 4s ease-in-out infinite !important; pointer-events: none;}
    .annette-quiz-opt2 .b1 { --rot: -4deg; animation-delay: 0s !important; }
    .annette-quiz-opt2 .b2 { --rot: 5deg; animation-delay: 1.2s !important; }
    .annette-quiz-opt2 .b3 { --rot: -3deg; animation-delay: 0.6s !important; }
    @keyframes floatBubble { 
      0%, 100% { transform: translateY(0) rotate(var(--rot)); } 
      50% { transform: translateY(-8px) rotate(var(--rot)); } 
    }

    .annette-quiz-opt2 h1 {font-size:24px !important; font-weight:700 !important; line-height:1.25 !important; margin:0 0 24px !important; color:var(--ink) !important; letter-spacing:-0.02em !important;}
    .annette-quiz-opt2 .q-count {font-size:13px !important; color:var(--muted) !important; font-weight:600 !important; display:block !important; margin:0 0 10px !important;}
    .annette-quiz-opt2 .barwrap {height:6px !important; background:rgba(254, 251, 249, 0.5) !important; border-radius:4px !important; overflow:hidden !important; margin:0 0 32px !important;}
    .annette-quiz-opt2 .q-bar {height:100% !important; width:20%; background:var(--ink) !important; transition:width .4s cubic-bezier(0.4, 0, 0.2, 1) !important;}
    .annette-quiz-opt2 .q {font-size:19px !important; font-weight:600 !important; line-height:1.4 !important; margin:0 0 24px !important;}
    .annette-quiz-opt2 .qopt { display:block !important; width:100% !important; text-align:left !important; background:var(--element-bg) !important; border: 2px solid transparent !important; border-radius:16px !important; padding:18px 20px !important; margin:0 0 12px !important; font-size:16px !important; font-family:inherit !important; font-weight:500 !important; color:var(--ink) !important; cursor:pointer !important; box-shadow: 0 2px 8px rgba(15, 15, 14, 0.04) !important; transition:all .2s ease !important; -webkit-tap-highlight-color:transparent !important; }
    .annette-quiz-opt2 .qopt:hover, .annette-quiz-opt2 .qopt:active { border-color:var(--ink) !important; transform: translateY(-2px) !important; box-shadow: 0 6px 16px rgba(15, 15, 14, 0.08) !important; }
    .annette-quiz-opt2 .lead {font-size:22px !important; font-weight:700 !important; line-height:1.3 !important; margin:0 0 12px !important;}
    .annette-quiz-opt2 .sub {font-size:16px !important; color:var(--muted) !important; line-height:1.5 !important; margin:0 0 28px !important;}
    .annette-quiz-opt2 button.cta { position: relative; z-index: 10; background:var(--ink) !important; color:var(--element-bg) !important; border:none !important; width:100% !important; padding:18px !important; border-radius:16px !important; font-size:17px !important; font-weight:600 !important; cursor:pointer !important; transition:all .2s !important; box-shadow: 0 4px 12px rgba(15, 15, 14, 0.15) !important; margin: 0 !important; }
    .annette-quiz-opt2 button.cta:hover { transform: scale(0.98) !important; opacity:.9 !important; }
    .annette-quiz-opt2 .feat {display:flex !important; gap:14px !important; align-items:flex-start !important; margin:0 0 18px !important;}
    .annette-quiz-opt2 .feat svg {flex-shrink:0 !important; margin-top:2px !important;}
    .annette-quiz-opt2 .feat p {font-size:15px !important; line-height:1.5 !important; margin:0 !important;}
    .annette-quiz-opt2 .google {display:flex !important; align-items:center !important; justify-content:center !important; gap:8px !important; background:var(--element-bg) !important; border-radius:14px !important; padding:14px !important; margin:12px 0 24px !important;}
    .annette-quiz-opt2 .google .stars {color:#EF9F27 !important; font-size:17px !important;}
    .annette-quiz-opt2 .google .txt {font-size:13px !important; color:var(--muted) !important; font-weight:500 !important;}
    .annette-quiz-opt2 .reassure {font-size:13px !important; color:var(--muted) !important; margin:14px 0 0 !important; text-align:center !important;}
    
    @media(max-width:420px){ 
      .annette-quiz-opt2 .card {padding:1.5rem !important;} 
      .annette-quiz-opt2 h1 {font-size:22px !important;} 
      .annette-quiz-opt2 .bubble-wrap { gap: 8px; margin-bottom: 20px !important;}
      .annette-quiz-opt2 .bubble { padding: 6px 12px !important; font-size: 13px !important; }
    }
  </style>

  <div class="card" id="annette-card-opt2">
    <div id="annette-quiz-head-opt2" style="display: none;">
      <h1>Avez-vous besoin d'un accompagnement pour perdre du poids&nbsp;?</h1>
      <div id="annette-q-count-opt2" class="q-count">Question 1 / 5</div>
      <div class="barwrap"><div id="annette-q-bar-opt2" class="q-bar"></div></div>
    </div>
    <div id="annette-quiz-stage-opt2">
      <div class="slide-container hook-container" id="current-slide-opt2">
        
        <!-- Nouveau bloc flex pour isoler les bulles -->
        <div class="bubble-wrap">
          <div class="bubble b1">Effet yoyo&nbsp;?</div>
          <div class="bubble b2">Fringales&nbsp;?</div>
          <div class="bubble b3">Démotivé·e&nbsp;?</div>
        </div>

        <h1 style="font-size: 28px !important; margin-bottom: 16px !important;">On fait le point sur votre perte de poids&nbsp;?</h1>
        <p class="sub" style="margin-bottom: 32px !important;">Un test rapide en 45 secondes pour savoir si un accompagnement est adapté à votre situation actuelle.</p>
        <button class="cta" id="btn-start-quiz-opt2">Faire le test →</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var card = document.getElementById('annette-card-opt2');
      if('IntersectionObserver' in window) {
        new IntersectionObserver((entries, observer) => {
          if(entries[0].isIntersecting) { card.classList.add('is-visible'); observer.disconnect(); }
        }, { threshold: 0.2 }).observe(card);
      } else { card.classList.add('is-visible'); }

      var Q=[
        {q:"Combien de fois avez-vous perdu du poids… avant de tout reprendre&nbsp;?",o:["Jamais","Une fois","Plusieurs fois, c'est décourageant"]},
        {q:"Votre poids pèse-t-il sur votre quotidien : énergie, souffle, articulations&nbsp;?",o:["Pas vraiment","Un peu","Oui, tous les jours"]},
        {q:"Face à la nourriture, vous sentez-vous parfois dépassé·e (fringales, craquages)&nbsp;?",o:["Rarement","Parfois","Souvent"]},
        {q:"Dans cette démarche, vous sentez-vous seul·e&nbsp;?",o:["Non, bien entouré·e","Parfois","Oui, très seul·e"]},
        {q:"Enfin, où en êtes-vous actuellement&nbsp;?",o:["Je suis sous traitement pour perdre du poids","J'envisage un traitement médical","Je préfère avancer sans"]}
      ];
      var idx=0;
      var stage=document.getElementById('annette-quiz-stage-opt2'), bar=document.getElementById('annette-q-bar-opt2'), count=document.getElementById('annette-q-count-opt2'), head=document.getElementById('annette-quiz-head-opt2');

      document.getElementById('btn-start-quiz-opt2').onclick = function() {
        document.getElementById('current-slide-opt2').classList.add('slide-out');
        setTimeout(function(){ head.style.display = 'block'; render(); }, 300);
      };
  
      function render(){
        count.textContent='Question '+(idx+1)+' / '+Q.length;
        bar.style.width=((idx+1)/Q.length*100)+'%';
        var html='<div class="slide-container" id="current-slide-opt2"><p class="q">'+Q[idx].q+'</p>';
        Q[idx].o.forEach(function(opt,i){html+='<button class="qopt" data-i="'+i+'">'+opt+'</button>';});
        stage.innerHTML=html+'</div>';
        
        var btns = stage.querySelectorAll('.qopt');
        for(var j=0; j<btns.length; j++){
          btns[j].onclick = function(){
            this.style.borderColor='var(--ink)';
            document.getElementById('current-slide-opt2').classList.add('slide-out');
            setTimeout(function(){ idx++; if(idx < Q.length) { render(); } else { result(); } }, 300);
          };
        }
      }
  
      function result(){
        head.style.display='none';
        var html = '<div class="slide-container"><p class="lead">Vous avez déjà fait beaucoup d\'efforts.</p><p class="sub">Être bien entouré·e est souvent la clé pour enfin avancer sereinement. C\'est exactement ce qu\'Annette vous apporte.</p>';
        var feats = [
          ['<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>', "Un réseau de <b>médecins partenaires</b>, disponibles rapidement si besoin."],
          ['<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5C6.8 16.6 4 13.7 4 9.9A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 8 1.9c0 3.8-2.8 6.7-8 10.6z"/></svg>', "Une <b>équipe de diététiciennes</b> joignable en illimité, au quotidien."],
          ['<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2.5"/><line x1="10" y1="18" x2="14" y2="18"/></svg>', "Une <b>app de suivi complète</b> : repas, injections, calories, recettes."],
          ['<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3 2.6-5 5.5-5s5.5 2 5.5 5"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6"/><path d="M15.5 15c3 .2 5 2.2 5 5"/></svg>', "Une <b>communauté soudée</b>, qui partage les mêmes défis que vous."]
        ].map(function(f){ return '<div class="feat">'+f[0]+'<p>'+f[1]+'</p></div>'; }).join('');
        stage.innerHTML = html + feats + '<div class="google"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg><span class="stars">★★★★★</span><span class="txt">5/5 · +3 000 patients accompagnés</span></div><button class="cta" onclick="var p=window.location.pathname.split(\'/\').filter(Boolean);var s=p.length>0?p[p.length-1]:\'page-accueil\';if(window.dataLayer)window.dataLayer.push({event:\'encart_cta_click\',encart:\'quiz_accompagnement\',article_slug:s});window.location.href=\'https://app.annette.care/signup?utm_source=article&utm_medium=encart&utm_campaign=quiz_accompagnement&utm_content=\'+s;">Vérifier mon éligibilité →</button><p class="reassure">Gratuit et sans engagement · 2 minutes</p></div>';
      }
    })();
  </script>
</div>
